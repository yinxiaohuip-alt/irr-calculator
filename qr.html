<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码访问 - IRR计算器</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 20px;
    color: #1e293b;
    margin: 0 0 8px;
  }
  p {
    color: #64748b;
    font-size: 14px;
    margin: 0 0 24px;
  }
  .qr-code {
    margin: 0 auto 24px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .qr-code img {
    width: 250px;
    height: 250px;
    display: block;
  }
  .url {
    display: block;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    color: #4f46e5;
    word-break: break-all;
    margin-bottom: 16px;
    font-family: "SF Mono", "Fira Code", monospace;
  }
  .btn {
    display: inline-block;
    background: #4f46e5;
    color: #fff;
    text-decoration: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    margin: 0 4px 8px;
  }
  .btn:hover { background: #4338ca; }
  .btn.secondary { background: #e2e8f0; color: #475569; }
  .btn.secondary:hover { background: #cbd5e1; }
  .note {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>📱 借款成本核算器</h1>
  <p>扫码即可打开，微信/浏览器均可</p>
  <div class="qr-code">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fyinxiaohuip-alt.github.io%2Firr-calculator%2F&bgcolor=ffffff&color=4f46e5&margin=10"
         alt="QR Code">
  </div>
  <span class="url">https://yinxiaohuip-alt.github.io/irr-calculator/</span>
  <div>
    <a class="btn" href="https://yinxiaohuip-alt.github.io/irr-calculator/" target="_blank">打开计算器</a>
    <a class="btn secondary" href="https://yinxiaohuip-alt.github.io/irr-calculator/share.html" target="_blank">分享页</a>

    ✅ 无需下载，点开即用 | ✅ 自动计算真实年化利率<br>
